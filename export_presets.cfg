html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>html, body { overscroll-behavior: none; overflow: hidden; position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } canvas { touch-action: none; }</style><script>/* Stop Safari treating drags in the game as page gestures (pull-to-refresh, scrolling, zooming). */document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });/* Each tap would otherwise arrive twice: as a touch and as Safari's imitation mouse click. */document.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });document.addEventListener('touchend', function (e) { e.preventDefault(); }, { passive: false });document.addEventListener('gesturestart', function (e) { e.preventDefault(); });</script><script>/* Crash clues for the game's resume note: graphics lost, script errors, normal page exits. */(function(){function note(k,v){try{localStorage.setItem('mushroom_moon_event'+(/\\/dev\\//.test(location.pathname)?'_dev':''),JSON.stringify({kind:k,detail:String(v).slice(0,160),time:Date.now()/1000}));}catch(e){}}window.addEventListener('error',function(e){note('script error',e.message);});window.addEventListener('unhandledrejection',function(e){note('script error',e.reason);});window.addEventListener('pagehide',function(){note('page closed','');});document.addEventListener('webglcontextlost',function(){note('graphics lost','');},true);window.addEventListener('load',function(){var c=document.querySelector('canvas');if(c){c.addEventListener('webglcontextlost',function(){note('graphics lost','');});}});})();</script>"
html/canvas_resize_policy=2
